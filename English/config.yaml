# FastSpeech 2 for English (Svarah, Indian-accented English, multi-speaker)
# Single file replacing upstream's preprocess.yaml / model.yaml / train.yaml.
# All `path` entries are relative to this file.

preprocess:
  dataset: "English"
  path:
    corpus_path: "../downloads/Svarah"            # parquet shards of ai4bharat/Svarah (gated)
    raw_path: "./raw_data"                        # 22.05 kHz wav + .lab, one dir per speaker
    preprocessed_path: "./preprocessed_data"      # TextGrid/, mel/, pitch/, energy/, duration/
    mfa_path: "./mfa"                             # g2p_en lexicon used with MFA english_us_arpa
  subset:
    min_duration: 1.5      # seconds, drops one-word commands ("sound off", "Two")
    max_duration: 11.0     # keeps every utterance < 1000 mel frames (max_seq_len)
    min_words: 3
    max_digit_run: 4       # phone numbers and PINs are read digit by digit, so skip them
    train_hours: 5.0
    val_hours: 1.0
    seed: 1234
  preprocessing:
    text:
      text_cleaners: ["english_cleaners"]
      language: "en"
    audio:
      sampling_rate: 22050
      max_wav_value: 32768.0
    stft:
      filter_length: 1024
      hop_length: 256
      win_length: 1024
    mel:
      n_mel_channels: 80
      mel_fmin: 0
      mel_fmax: 8000
    pitch:
      feature: "phoneme_level"
      normalization: True
    energy:
      feature: "phoneme_level"
      normalization: True

model:
  transformer:
    encoder_layer: 4
    encoder_head: 2
    encoder_hidden: 256
    decoder_layer: 4         # as in the FastSpeech 2 paper (upstream uses 6)
    decoder_head: 2
    decoder_hidden: 256
    conv_filter_size: 1024
    conv_kernel_size: [9, 1]
    encoder_dropout: 0.2
    decoder_dropout: 0.2
  variance_predictor:
    filter_size: 256
    kernel_size: 3
    dropout: 0.5
  variance_embedding:
    pitch_quantization: "linear"
    energy_quantization: "linear"
    n_bins: 256
  multi_speaker: True
  max_seq_len: 1000
  vocoder:
    model: "HiFi-GAN"
    speaker: "universal"

train:
  seed: 1234
  mixed_precision: "auto"    # bf16 on Apple MPS and Ampere GPUs, fp16 with loss scaling on older GPUs
  pad_multiple: [16, 64]     # pad phones and frames to these multiples so fewer tensor shapes get compiled
  path:
    ckpt_path: "./checkpoints"
    log_path: "./logs"
    result_path: "../Results/English"
  optimizer:
    batch_size: 48           # as in the FastSpeech 2 paper (upstream uses 16)
    betas: [0.9, 0.98]
    eps: 0.000000001
    weight_decay: 0.0
    grad_clip_thresh: 1.0
    grad_acc_step: 1
    warm_up_step: 4000
    anneal_steps: [6000, 8000, 10000]    # lower the learning rate in the second half of the run
    anneal_rate: 0.3
  step:
    total_step: 12000        # long enough to see the validation minimum and what follows on 5 h of data
    log_step: 100
    synth_step: 2000
    val_step: 500
    save_step: 1000
